[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibex-predictor"
version = "0.1.0"
description = "IBEX 35 price and direction prediction bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.3.0",
  "yfinance>=0.2.37",
  "ta>=0.11.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "streamlit>=1.33.0",
  "streamlit-autorefresh>=1.0.1",
  "plotly>=5.22.0",
  "mlflow>=2.11.0",
  "joblib>=1.3.0",
  "scipy>=1.12.0",
  "pandera>=0.18.0",
  "pytest>=8.0.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
