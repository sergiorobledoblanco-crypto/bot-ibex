project:
  name: ibex-predictor
  random_seed: 42

data:
  start_date: "2014-01-01"
  end_date: null
  interval: "1d"
  provider: "yfinance"
  raw_path: "data/raw"
  processed_path: "data/processed"
  feature_path: "data/features"
  dataset_path: "data/datasets"

modeling:
  target_type: "direction"
  horizon_days: 1
  test_size: 0.2
  cv_splits: 5
  classification_model: "lightgbm"
  regression_model: "lightgbm"

evaluation:
  probability_threshold: 0.55
  transaction_cost_bps: 10

portfolio:
  top_n: 5
  min_prob: 0.55

serving:
  predictions_file: "artifacts/reports/latest_predictions.csv"
  host: "127.0.0.1"
  port: 8000
